name: Issue Inactive

on:
  schedule:
    # GMT+8 03:00
    - cron: '0 19 * * *'

permissions:
  issues: write

jobs:
  check-inactive:
    runs-on: ubuntu-latest
    steps:
      - name: check-inactive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '14 days ago' '+%Y-%m-%d')"
          query="repo:${GH_REPO} is:issue is:open updated:<${cutoff} -label:inactive"

          gh api --method GET --paginate /search/issues -f q="${query}" -f per_page=100 --jq '.items[].number' |
          while read -r issue_number; do
            [ -n "$issue_number" ] || continue
            gh issue edit "${issue_number}" --repo "${GH_REPO}" --add-label "inactive"
          done
